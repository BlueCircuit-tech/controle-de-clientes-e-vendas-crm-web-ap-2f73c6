<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendare CRM — Gestão de Clientes e Vendas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        marinho: {
          50:  '#eef4fb',
          100: '#d6e4f4',
          200: '#adc8e8',
          300: '#7ba4d6',
          400: '#4a7bbd',
          500: '#2c5c9e',
          600: '#1f4680',
          700: '#173montante',
          800: '#122a4d',
          900: '#0d1f39'
        },
        ambar: {
          50:  '#fff8ec',
          100: '#ffedcc',
          200: '#ffd98f',
          300: '#ffc355',
          400: '#f7a916',
          500: '#e08c00',
          600: '#b56d00'
        },
        verdeok: '#0f9d76',
        vermelho: '#d64545',
        areia: '#f5f3ef',
        grafite: '#2b2f38'
      },
      fontFamily: {
        titulo: ['Sora', 'sans-serif'],
        corpo: ['Manrope', 'sans-serif']
      },
      boxShadow: {
        cartao: '0 2px 14px -4px rgba(18,42,77,0.16)',
        barra: '0 -4px 20px -6px rgba(18,42,77,0.22)'
      }
    }
  }
}
</script>
<style>
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    font-family: 'Manrope', sans-serif;
    background: #e7e9ee;
  }
  #aparelho {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: #f5f3ef;
    position: relative;
    box-shadow: 0 0 40px -10px rgba(13,31,57,.35);
  }
  h1,h2,h3,h4,.font-titulo { font-family: 'Sora', sans-serif; }

  .nav-btn {
    color: #8d97a8;
    transition: color .18s ease, transform .18s ease;
  }
  .nav-btn span.rotulo { font-size: 10px; letter-spacing: .01em; }
  .nav-btn .bolha {
    width: 38px; height: 30px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 11px;
    transition: background .18s ease;
  }
  .nav-btn.ativo { color: #12294d; }
  .nav-btn.ativo .bolha { background: #ffd98f; }
  .nav-btn.ativo span.rotulo { font-weight: 700; }
  .nav-btn:active { transform: scale(.94); }

  main { padding-bottom: 92px; }

  ::-webkit-scrollbar { width: 0px; }
</style>
</head>
<body class="font-corpo text-grafite">

<div id="aparelho">

  <main>
    <!-- TELAS -->
  </main>

  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-[#e2e0da] shadow-barra z-50">
    <div class="flex items-stretch justify-between px-1.5 pt-2 pb-2">

      <button data-nav="painel-de-vendas" onclick="mostrarTela('painel-de-vendas')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 9l-4.5 5-3-3L7 14.5"/></svg>
        </span>
        <span class="rotulo">Painel</span>
      </button>

      <button data-nav="clientes" onclick="mostrarTela('clientes')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        </span>
        <span class="rotulo">Clientes</span>
      </button>

      <button data-nav="ficha-do-cliente" onclick="mostrarTela('ficha-do-cliente')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
        </span>
        <span class="rotulo">Ficha</span>
      </button>

      <button data-nav="novo-orcamento" onclick="mostrarTela('novo-orcamento')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M12 11v6M9 14h6"/></svg>
        </span>
        <span class="rotulo">Orçar</span>
      </button>

      <button data-nav="agenda" onclick="mostrarTela('agenda')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <span class="rotulo">Agenda</span>
      </button>

      <button data-nav="relatorios" onclick="mostrarTela('relatorios')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-5M12 17V7M16 17v-8"/></svg>
        </span>
        <span class="rotulo">Relatórios</span>
      </button>

    </div>
  </nav>

</div>

<script>
  function mostrarTela(id) {
    document.querySelectorAll('[data-tela]').forEach(function (s) {
      s.classList.toggle('hidden', s.dataset.tela !== id);
    });
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      b.classList.toggle('ativo', b.dataset.nav === id);
    });
    window.scrollTo({ top: 0 });
  }
  document.addEventListener('DOMContentLoaded', function () {
    mostrarTela('painel-de-vendas');
  });
</script>

</body>
</html>
