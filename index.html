<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendare CRM — Gestão de Clientes e Vendas</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        marinho: {
          50:  '#eef4fb',
          100: '#d6e4f4',
          200: '#adc8e8',
          300: '#7ba4d6',
          400: '#4a7bbd',
          500: '#2c5c9e',
          600: '#1f4680',
          700: '#173montante',
          800: '#122a4d',
          900: '#0d1f39'
        },
        ambar: {
          50:  '#fff8ec',
          100: '#ffedcc',
          200: '#ffd98f',
          300: '#ffc355',
          400: '#f7a916',
          500: '#e08c00',
          600: '#b56d00'
        },
        verdeok: '#0f9d76',
        vermelho: '#d64545',
        areia: '#f5f3ef',
        grafite: '#2b2f38'
      },
      fontFamily: {
        titulo: ['Sora', 'sans-serif'],
        corpo: ['Manrope', 'sans-serif']
      },
      boxShadow: {
        cartao: '0 2px 14px -4px rgba(18,42,77,0.16)',
        barra: '0 -4px 20px -6px rgba(18,42,77,0.22)'
      }
    }
  }
}
</script>
<style>
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    font-family: 'Manrope', sans-serif;
    background: #e7e9ee;
  }
  #aparelho {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: #f5f3ef;
    position: relative;
    box-shadow: 0 0 40px -10px rgba(13,31,57,.35);
  }
  h1,h2,h3,h4,.font-titulo { font-family: 'Sora', sans-serif; }

  .nav-btn {
    color: #8d97a8;
    transition: color .18s ease, transform .18s ease;
  }
  .nav-btn span.rotulo { font-size: 10px; letter-spacing: .01em; }
  .nav-btn .bolha {
    width: 38px; height: 30px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 11px;
    transition: background .18s ease;
  }
  .nav-btn.ativo { color: #12294d; }
  .nav-btn.ativo .bolha { background: #ffd98f; }
  .nav-btn.ativo span.rotulo { font-weight: 700; }
  .nav-btn:active { transform: scale(.94); }

  main { padding-bottom: 92px; }

  ::-webkit-scrollbar { width: 0px; }
</style>
</head>
<body class="font-corpo text-grafite">

<div id="aparelho">

  <main>
    <section data-tela="painel-de-vendas" class="hidden">
  <style>
    .pv-card{background:#fff;border:1px solid #e6e2da;border-radius:16px;box-shadow:0 1px 2px rgba(28,42,58,.04)}
    .pv-kpi{padding:14px;text-align:left;width:100%;transition:.15s}
    .pv-kpi:active{transform:scale(.97)}
    .pv-lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8a8378;font-weight:600}
    .pv-bar{background:#1c3d5a;border-radius:4px 4px 0 0;width:100%;transition:height .4s}
    .pv-chip{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600}
  </style>

  <div class="px-4 pt-4 pb-24 bg-[#f7f5f1]">

    <div class="flex items-center gap-3 mb-4">
      <div class="w-12 h-12 rounded-full bg-[#1c3d5a] text-white flex items-center justify-center text-lg font-bold">RM</div>
      <div class="flex-1">
        <p class="text-[13px] text-[#8a8378]" id="pv-saudacao">Boa tarde,</p>
        <p class="text-[17px] font-bold text-[#1c2a3a] leading-tight">Rafael Menezes</p>
      </div>
      <button onclick="mostrarTela('agenda')" class="relative w-10 h-10 rounded-full bg-white border border-[#e6e2da] flex items-center justify-center">
        <span class="text-lg">🔔</span>
        <span class="absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#e2703a] text-white text-[10px] flex items-center justify-center font-bold">3</span>
      </button>
    </div>

    <div class="pv-card p-4 mb-3 bg-[#1c3d5a] border-[#1c3d5a]">
      <p class="text-[11px] uppercase tracking-wider text-[#9fc0d8] font-semibold">Faturamento de Março</p>
      <p class="text-white text-[30px] font-bold leading-tight mt-1">R$ 187.430<span class="text-[18px] text-[#9fc0d8]">,00</span></p>
      <div class="flex items-center gap-2 mt-1 mb-3">
        <span class="pv-chip bg-[#2f7d5d] text-white">▲ 14,2%</span>
        <span class="text-[12px] text-[#9fc0d8]">vs. fevereiro</span>
      </div>
      <div class="h-2 rounded-full bg-[#0f2a41] overflow-hidden">
        <div class="h-full bg-[#e2703a] rounded-full" style="width:78%"></div>
      </div>
      <div class="flex justify-between mt-1.5">
        <span class="text-[11px] text-[#9fc0d8]">Meta: R$ 240.000</span>
        <span class="text-[11px] text-white font-semibold">78% atingido</span>
      </div>
      <button onclick="mostrarTela('relatorios')" class="w-full mt-3 py-2.5 rounded-xl bg-white/10 text-white text-[13px] font-semibold border border-white/15">Ver relatório completo</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <button onclick="mostrarTela('novo-orcamento')" class="pv-card pv-kpi">
        <p class="pv-lbl">Pedidos em aberto</p>
        <p class="text-[26px] font-bold text-[#1c2a3a] leading-tight mt-0.5">14</p>
        <p class="text-[12px] text-[#e2703a] font-semibold">R$ 62.180 em negociação</p>
      </button>
      <button onclick="mostrarTela('clientes')" class="pv-card pv-kpi">
        <p class="pv-lbl">Clientes ativos</p>
        <p class="text-[26px] font-bold text-[#1c2a3a] leading-tight mt-0.5">238</p>
        <p class="text-[12px] text-[#2f7d5d] font-semibold">+9 neste mês</p>
      </button>
    </div>

    <div class="pv-card p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <p class="text-[14px] font-bold text-[#1c2a3a]">Vendas por período</p>
        <div class="flex bg-[#f0ede7] rounded-lg p-0.5" id="pv-filtros">
          <button onclick="painel_de_vendas_periodo('semana',this)" class="px-2.5 py-1 text-[11px] font-semibold rounded-md text-[#8a8378]">Semana</button>
          <button onclick="painel_de_vendas_periodo('mes',this)" class="px-2.5 py-1 text-[11px] font-semibold rounded-md bg-white text-[#1c3d5a] shadow-sm">Mês</button>
          <button onclick="painel_de_vendas_periodo('tri',this)" class="px-2.5 py-1 text-[11px] font-semibold rounded-md text-[#8a8378]">Tri</button>
        </div>
      </div>
      <div class="flex items-end gap-2 h-28" id="pv-grafico"></div>
      <div class="flex gap-2 mt-2" id="pv-rotulos"></div>
      <p class="text-[12px] text-[#8a8378] mt-3 pt-3 border-t border-[#f0ede7]" id="pv-resumo">Melhor semana: 17 a 23/03 com R$ 54.900 em 11 pedidos.</p>
    </div>

    <div class="flex items-center justify-between mb-2">
      <p class="text-[14px] font-bold text-[#1c2a3a]">Próximos compromissos</p>
      <button onclick="mostrarTela('agenda')" class="text-[12px] font-semibold text-[#e2703a]">Ver agenda</button>
    </div>
    <div class="space-y-2 mb-5">
      <button onclick="mostrarTela('ficha-do-cliente')" class="pv-card w-full p-3 flex gap-3 items-center text-left">
        <div class="w-12 shrink-0 text-center">
          <p class="text-[15px] font-bold text-[#1c3d5a] leading-none">09:30</p>
          <p class="text-[10px] text-[#8a8378] mt-0.5">hoje</p>
        </div>
        <div class="w-px self-stretch bg-[#f0ede7]"></div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-semibold text-[#1c2a3a] truncate">Visita — Metalúrgica Andrade</p>
          <p class="text-[12px] text-[#8a8378] truncate">Av. das Indústrias, 1240 — São Bernardo</p>
        </div>
        <span class="pv-chip bg-[#fde8dd] text-[#c2551f]">Visita</span>
      </button>
      <button onclick="mostrarTela('novo-orcamento')" class="pv-card w-full p-3 flex gap-3 items-center text-left">
        <div class="w-12 shrink-0 text-center">
          <p class="text-[15px] font-bold text-[#1c3d5a] leading-none">14:00</p>
          <p class="text-[10px] text-[#8a8378] mt-0.5">hoje</p>
        </div>
        <div class="w-px self-stretch bg-[#f0ede7]"></div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-semibold text-[#1c2a3a] truncate">Apresentar orçamento #2841</p>
          <p class="text-[12px] text-[#8a8378] truncate">Construtora Vale Verde · R$ 18.750</p>
        </div>
        <span class="pv-chip bg-[#dbeafe] text-[#1c3d5a]">Reunião</span>
      </button>
      <button onclick="mostrarTela('agenda')" class="pv-card w-full p-3 flex gap-3 items-center text-left">
        <div class="w-12 shrink-0 text-center">
          <p class="text-[15px] font-bold text-[#1c3d5a] leading-none">08:15</p>
          <p class="text-[10px] text-[#8a8378] mt-0.5">qui, 27</p>
        </div>
        <div class="w-px self-stretch bg-[#f0ede7]"></div>
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-semibold text-[#1c2a3a] truncate">Retorno — Padaria Dona Ilda</p>
          <p class="text-[12px] text-[#8a8378] truncate">Renovação de contrato anual</p>
        </div>
        <span class="pv-chip bg-[#e4f2ea] text-[#2f7d5d]">Ligação</span>
      </button>
    </div>

    <p class="text-[14px] font-bold text-[#1c2a3a] mb-2">Atalhos</p>
    <div class="grid grid-cols-3 gap-3 mb-5">
      <button onclick="mostrarTela('clientes')" class="pv-card py-4 flex flex-col items-center gap-1.5">
        <span class="text-[22px]">👥</span>
        <span class="text-[12px] font-semibold text-[#1c2a3a]">Clientes</span>
      </button>
      <button onclick="mostrarTela('novo-orcamento')" class="pv-card py-4 flex flex-col items-center gap-1.5">
        <span class="text-[22px]">🧾</span>
        <span class="text-[12px] font-semibold text-[#1c2a3a]">Orçamento</span>
      </button>
      <button onclick="mostrarTela('relatorios')" class="pv-card py-4 flex flex-col items-center gap-1.5">
        <span class="text-[22px]">📦</span>
        <span class="text-[12px] font-semibold text-[#1c2a3a]">Catálogo</span>
      </button>
    </div>

    <div class="flex items-center justify-between mb-2">
      <p class="text-[14px] font-bold text-[#1c2a3a]">Últimos pedidos</p>
      <button onclick="mostrarTela('relatorios')" class="text-[12px] font-semibold text-[#e2703a]">Todos</button>
    </div>
    <div class="pv-card divide-y divide-[#f0ede7] mb-4">
      <button onclick="painel_de_vendas_abrir('#2841','Construtora Vale Verde')" class="w-full p-3 flex items-center gap-3 text-left">
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-semibold text-[#1c2a3a] truncate">Construtora Vale Verde</p>
          <p class="text-[11px] text-[#8a8378]">Orçamento #2841 · 24/03</p>
        </div>
        <div class="text-right">
          <p class="text-[13px] font-bold text-[#1c2a3a]">R$ 18.750</p>
          <span class="pv-chip bg-[#fef3c7] text-[#92400e]">Aguardando</span>
        </div>
      </button>
      <button onclick="painel_de_vendas_abrir('#2838','Metalúrgica Andrade')" class="w-full p-3 flex items-center gap-3 text-left">
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-semibold text-[#1c2a3a] truncate">Metalúrgica Andrade</p>
          <p class="text-[11px] text-[#8a8378]">Pedido #2838 · 22/03</p>
        </div>
        <div class="text-right">
          <p class="text-[13px] font-bold text-[#1c2a3a]">R$ 41.200</p>
          <span class="pv-chip bg-[#e4f2ea] text-[#2f7d5d]">Aprovado</span>
        </div>
      </button>
      <button onclick="painel_de_vendas_abrir('#2835','Supermercado Lopes')" class="w-full p-3 flex items-center gap-3 text-left">
        <div class="flex-1 min-w-0">
          <p class="text-[13px] font-semibold text-[#1c2a3a] truncate">Supermercado Lopes</p>
          <p class="text-[11px] text-[#8a8378]">Pedido #2835 · 19/03</p>
        </div>
        <div class="text-right">
          <p class="text-[13px] font-bold text-[#1c2a3a]">R$ 7.980</p>
          <span class="pv-chip bg-[#e4f2ea] text-[#2f7d5d]">Faturado</span>
        </div>
      </button>
    </div>

    <button onclick="mostrarTela('novo-orcamento')" class="w-full py-3.5 rounded-2xl bg-[#e2703a] text-white text-[15px] font-bold shadow-lg shadow-orange-900/10">+ Novo orçamento</button>
  </div>

  <div id="pv-toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-50 bg-[#1c2a3a] text-white text-[13px] px-4 py-2.5 rounded-xl shadow-xl"></div>

  <script>
    var painel_de_vendas_dados = {
      semana:{v:[6.2,9.4,7.1,12.8,10.3,4.9],r:['Seg','Ter','Qua','Qui','Sex','Sáb'],t:'Melhor dia: quinta (26/03) com R$ 12.800 em 4 pedidos.'},
      mes:{v:[38.5,44.2,54.9,32.1,17.7,0],r:['S1','S2','S3','S4','S5',''],t:'Melhor semana: 17 a 23/03 com R$ 54.900 em 11 pedidos.'},
      tri:{v:[142.6,158.9,187.4,0,0,0],r:['Jan','Fev','Mar','','',''],t:'Crescimento acumulado de 31,4% no trimestre.'}
    };
    function painel_de_vendas_periodo(p, el){
      if(el){
        document.querySelectorAll('#pv-filtros button').forEach(function(b){
          b.className='px-2.5 py-1 text-[11px] font-semibold rounded-md text-[#8a8378]';
        });
        el.className='px-2.5 py-1 text-[11px] font-semibold rounded-md bg-white text-[#1c3d5a] shadow-sm';
      }
      var d=painel_de_vendas_dados[p], max=Math.max.apply(null,d.v);
      var g=document.getElementById('pv-grafico'), r=document.getElementById('pv-rotulos');
      g.innerHTML='';r.innerHTML='';
      d.v.forEach(function(v,i){
        var h=max? Math.round(v/max*100):0;
        var w=document.createElement('div');
        w.className='flex-1 flex flex-col justify-end h-full cursor-pointer';
        w.onclick=function(){painel_de_vendas_toast(d.r[i]||'—','R$ '+v.toFixed(1).replace('.',',')+' mil');};
        w.innerHTML='<div class="pv-bar" style="height:'+(h<4?4:h)+'%;'+(v===max&&max>0?'background:#e2703a':'')+'"></div>';
        g.appendChild(w);
        var l=document.createElement('div');
        l.className='flex-1 text-center text-[10px] text-[#8a8378] font-medium';
        l.textContent=d.r[i];
        r.appendChild(l);
      });
      document.getElementById('pv-resumo').textContent=d.t;
    }
    function painel_de_vendas_toast(t,s){
      var e=document.getElementById('pv-toast');
      e.textContent=t+' · '+s;
      e.classList.remove('hidden');
      clearTimeout(window.pvT);
      window.pvT=setTimeout(function(){e.classList.add('hidden');},1800);
    }
    function painel_de_vendas_abrir(num,nome){
      painel_de_vendas_toast(nome,'abrindo '+num);
      setTimeout(function(){mostrarTela('ficha-do-cliente');},450);
    }
    (function(){
      var h=new Date().getHours();
      var s=h<12?'Bom dia,':(h<18?'Boa tarde,':'Boa noite,');
      var el=document.getElementById('pv-saudacao');
      if(el) el.textContent=s;
      painel_de_vendas_periodo('mes',null);
    })();
  </script>
</section>

    <!-- TELAS -->
  </main>

  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-[#e2e0da] shadow-barra z-50">
    <div class="flex items-stretch justify-between px-1.5 pt-2 pb-2">

      <button data-nav="painel-de-vendas" onclick="mostrarTela('painel-de-vendas')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 9l-4.5 5-3-3L7 14.5"/></svg>
        </span>
        <span class="rotulo">Painel</span>
      </button>

      <button data-nav="clientes" onclick="mostrarTela('clientes')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        </span>
        <span class="rotulo">Clientes</span>
      </button>

      <button data-nav="ficha-do-cliente" onclick="mostrarTela('ficha-do-cliente')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
        </span>
        <span class="rotulo">Ficha</span>
      </button>

      <button data-nav="novo-orcamento" onclick="mostrarTela('novo-orcamento')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M12 11v6M9 14h6"/></svg>
        </span>
        <span class="rotulo">Orçar</span>
      </button>

      <button data-nav="agenda" onclick="mostrarTela('agenda')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <span class="rotulo">Agenda</span>
      </button>

      <button data-nav="relatorios" onclick="mostrarTela('relatorios')" class="nav-btn flex-1 flex flex-col items-center gap-0.5">
        <span class="bolha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-5M12 17V7M16 17v-8"/></svg>
        </span>
        <span class="rotulo">Relatórios</span>
      </button>

    </div>
  </nav>

</div>

<script>
  function mostrarTela(id) {
    document.querySelectorAll('[data-tela]').forEach(function (s) {
      s.classList.toggle('hidden', s.dataset.tela !== id);
    });
    document.querySelectorAll('[data-nav]').forEach(function (b) {
      b.classList.toggle('ativo', b.dataset.nav === id);
    });
    window.scrollTo({ top: 0 });
  }
  document.addEventListener('DOMContentLoaded', function () {
    mostrarTela('painel-de-vendas');
  });
</script>

</body>
</html>
